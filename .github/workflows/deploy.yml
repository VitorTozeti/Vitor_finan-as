name: Build e deploy na Cloudflare

# Qualquer branch: compila (tsc + vite) e valida o Worker (dry-run).
# main: além disso publica na Cloudflare (app + API + banco D1).
#
# Secrets do repositório (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   token com permissão "Edit Cloudflare Workers" + "D1 Edit"
#   CLOUDFLARE_ACCOUNT_ID  id da conta Cloudflare
#   PLUGGY_CLIENT_ID / PLUGGY_CLIENT_SECRET   credenciais do Pluggy (Open Finance)
#   BRAPI_TOKEN            (opcional) token da brapi.dev para cotações

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run build
      - name: Validar Worker (dry-run)
        run: npx --yes wrangler@4 deploy --dry-run --outdir .wrangler-dry
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Conferir secrets da Cloudflare
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Faltam os secrets CLOUDFLARE_API_TOKEN e/ou CLOUDFLARE_ACCOUNT_ID no repositório."
            exit 1
          fi

      - name: Banco D1 (cria se faltar e injeta o id)
        run: |
          id_of() { npx --yes wrangler@4 d1 list --json | jq -r '.[] | select(.name=="greenfinance") | .uuid' | head -n1; }
          ID="$(id_of)"
          if [ -z "$ID" ]; then
            npx --yes wrangler@4 d1 create greenfinance
            ID="$(id_of)"
          fi
          test -n "$ID"
          sed -i "s/__D1_DATABASE_ID__/$ID/" wrangler.toml
          echo "D1 greenfinance = $ID"

      - name: Migrations do D1
        run: npx --yes wrangler@4 d1 migrations apply greenfinance --remote

      - name: Publicar Worker (app + API)
        run: npx --yes wrangler@4 deploy

      - name: Enviar segredos (Pluggy / brapi)
        env:
          PLUGGY_CLIENT_ID: ${{ secrets.PLUGGY_CLIENT_ID }}
          PLUGGY_CLIENT_SECRET: ${{ secrets.PLUGGY_CLIENT_SECRET }}
          BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
        run: |
          jq -n \
            --arg a "$PLUGGY_CLIENT_ID" --arg b "$PLUGGY_CLIENT_SECRET" --arg c "$BRAPI_TOKEN" \
            '{PLUGGY_CLIENT_ID:$a, PLUGGY_CLIENT_SECRET:$b, BRAPI_TOKEN:$c} | with_entries(select(.value != ""))' \
            > secrets.json
          if [ "$(jq 'length' secrets.json)" -gt 0 ]; then
            npx --yes wrangler@4 secret bulk secrets.json
          else
            echo "Nenhum segredo definido no GitHub — mantendo os que já estão no Worker."
          fi
          rm -f secrets.json
