# Config do Cloudflare Worker (o proxy do Open Finance).
#
# Deploy:
#   cd worker
#   npx wrangler login
#   npx wrangler secret put PLUGGY_CLIENT_ID
#   npx wrangler secret put PLUGGY_CLIENT_SECRET
#   npx wrangler deploy
#
# Os segredos NÃO ficam aqui — o `wrangler secret put` guarda criptografado
# na Cloudflare. Este arquivo pode ir para o git sem risco.

name = "vitor-finance-proxy"
main = "worker.js"
compatibility_date = "2024-11-01"
